<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="gallery.css" />

    <title>gallery</title>
  </head>
  <body>
    <div class="container">
      <div class="gallery-wrap">
        <div class="back-btn move-btn" id="back">
          <img class="img-btn" src="images/back (2).png" alt="" />
        </div>
        <div class="gallery">
          <div class="gallery-item">
            <span class="span"
              ><img class="img" src="images/2.png" alt=""
            /></span>
            <span class="span"
              ><img class="img" src="images/3.jpg" alt=""
            /></span>
            <span class="span"
              ><img class="img" src="images/1.jpg" alt=""
            /></span>
          </div>

          <div class="gallery-item">
            <span class="span"
              ><img class="img" src="images/4.jpg" alt=""
            /></span>
            <span class="span"
              ><img class="img" src="images/5.jpg" alt=""
            /></span>
            <span class="span"
              ><img class="img" src="images/6.jpg" alt=""
            /></span>
          </div>

          <div class="gallery-item">
            <span class="span"
              ><img class="img" src="images/7.jpg" alt=""
            /></span>
            <span class="span"
              ><img class="img" src="images/8.jpg" alt=""
            /></span>
            <span class="span"
              ><img class="img" src="images/9.jpg" alt=""
            /></span>
          </div>
        </div>
        <div class="next-btn move-btn" id="next">
          <img class="img-btn" src="images/next.png" alt="" />
        </div>
      </div>
    </div>
    <script src="gallery.js"></script>
  </body>
</html>
