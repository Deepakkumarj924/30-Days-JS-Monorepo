<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="quote.css" />
    <title>Quote of the Day</title>
  </head>
  <body>
    <div class="card">
      <h1 id="heading">Quote of the day</h1>
      <div id="h-bar-center">
        <div id="h-bar"></div>
      </div>
      <p id="quote"></p>
      <div id="a-n-container">
        <p id="a-name"></p>
      </div>
      <div id="buttons">
        <button class="btn" id="new-quote">New Quote</button>
        <button class="btn" id="tweet">
          <img id="t-icon" src="twitter.png" alt="" />Tweet
        </button>
      </div>
    </div>
    <script src="quote.js"></script>
  </body>
</html>
