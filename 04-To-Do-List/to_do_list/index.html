<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="toDoList.css" />
    <title>To Do List</title>
  </head>
  <body>
    <div class="card">
      <div class="heading">
        <p id="h-text">TO-DO List</p>
        <img src="notebook.png" alt="h-img" id="h-img" />
      </div>
      <div class="form">
        <form action="">
          <input id="f-input" type="text" placeholder="Add your task" />
          <button id="f-button">Add</button>
        </form>
      </div>
      <div class="i-list hidden">
        <ul class="ul"></ul>
      </div>
    </div>

    <script src="toDoList.js"></script>
  </body>
</html>
