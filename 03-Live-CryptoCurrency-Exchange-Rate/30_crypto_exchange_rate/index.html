<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="cc.css" />
    <title>Crypto Currency</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">
          <a href="#"><img id="logo-img" src="images/logo.png" alt="" /></a>
        </div>
        <nav>
          <ul>
            <a href="#"><li>Market</li></a>
            <a href="#"><li>Features</li></a>
            <a href="#"><li>Contact Us</li></a>
            <a href="#"><li>About Us</li></a>
          </ul>
          <button id="language">EN</button>
        </nav>
      </div>

      <div class="middle">
        <p id="heading">
          BUY & <br />
          SELL <span id="highlighted">Crypto</span>
        </p>
        <p id="desc">
          World's biggest cryptocurrency exchange available on web as well as
          mobile phone.
        </p>
        <button id="explore">Explore More</button>
      </div>

      <div class="lower">
        <div class="component">
          <img src="images/bitcoin.png" alt="" />
          <div class="currency">
            <p id="b-value">$1234</p>
            <p class="name">Bitcoin</p>
          </div>
        </div>
        <div class="component">
          <img src="images/ethereum.png" alt="" />
          <div class="currency">
            <p id="e-value">$3556</p>
            <p class="name">Ethereum</p>
          </div>
        </div>
        <div class="component">
          <img src="images/dogecoin.png" alt="" />
          <div class="currency">
            <p id="d-value">$7890</p>
            <p class="name">Dogecoin</p>
          </div>
        </div>
      </div>
    </div>
    <script src="cc.js"></script>
  </body>
</html>
