<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>popup</title>
    <script
      src="https://kit.fontawesome.com/08741f0525.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="card">
      <button id="submit">Submit</button>
    </div>

    <div class="popup-overlay hidden">
      <div class="popup">
        <div class="popup-content-wrapper">
          <div class="img-div">
            <i class="fa-solid fa-circle-check"></i>
          </div>
          <h1>Thank You!</h1>
          <p>Your details have been successfully<br />submitted. Thanks!</p>
          <button id="ok">OK</button>
        </div>
      </div>
    </div>

    <script>
      const submitBtn = document.getElementById("submit");
      const okBtn = document.getElementById("ok");
      const popupOverlay = document.querySelector(".popup-overlay");

      function showPopUp() {
        popupOverlay.classList.remove("hidden");
        okBtn.focus();
      }

      function closePopUp() {
        popupOverlay.classList.add("hidden");
        submitBtn.focus();
      }

      submitBtn.addEventListener("click", showPopUp);
      okBtn.addEventListener("click", closePopUp);

      // ---  Allow closing by clicking the background overlay ---
      popupOverlay.addEventListener("click", (event) => {
        // Only close if the click is on the overlay itself, not the popup content
        if (event.target === popupOverlay) {
          closePopUp();
        }
      });

      // ---  Allow closing with the 'Escape' key ---
      document.addEventListener("keydown", (event) => {
        // Check if the popup is visible and the key is 'Escape'
        if (
          !popupOverlay.classList.contains("hidden") &&
          event.key === "Escape"
        ) {
          closePopUp();
        }
      });
    </script>
  </body>
</html>
