<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="email.css" />
    <title>Email Subscription</title>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <p id="soon">Coming Soon!</p>
        <p id="headline">Our Brand New<br />Website Is On It's Way</p>
        <p id="under-heading">Subscribe for more details.</p>
        <form action="" name="submit-to-google-sheet">
          <div class="input-container">
            <div class="input-div">
              <input
                id="input"
                type="email"
                name="email"
                placeholder="Your email id"
                required
              />
            </div>
            <button class="icon-div">
              <img id="img" src="send.png" alt="" />
            </button>
          </div>
        </form>
        <span id="span" class=""></span>
      </div>
    </div>
    <script src="email.js"></script>
  </body>
</html>
