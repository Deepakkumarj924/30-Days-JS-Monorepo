<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="coming.css" />
    <title>Coming soon page</title>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img src="image/logo.png" alt="" />
      </div>
      <div class="content">
        <p id="maintenance">Website is under Maintenance</p>
        <h1>We're <span>Launching</span> Soon</h1>
        <div class="launch-time">
          <div>
            <p id="days">00</p>
            <span>Days</span>
          </div>
          <div>
            <p id="hours">00</p>
            <span>Hours</span>
          </div>
          <div>
            <p id="minutes">00</p>
            <span>Minutes</span>
          </div>
          <div>
            <p id="seconds">00</p>
            <span>Seconds</span>
          </div>
        </div>
        <button>Learn More <img src="image/play.png" alt="" /></button>
      </div>
      <div class="ufo">
        <img src="image/—Pngtree—flying small rocket_966387.png" alt="" />
      </div>
    </div>
    <script>
      let daysEle = document.getElementById("days");
      let hoursEle = document.getElementById("hours");
      let minutesEle = document.getElementById("minutes");
      let secondsEle = document.getElementById("seconds");

      let countDownDate = new Date("Jan 1, 2026 00:00:00").getTime();
      let x = setInterval(function () {
        let now = new Date().getTime();
        let distance = countDownDate - now;

        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
        var hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );
        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((distance % (1000 * 60)) / 1000);

        daysEle.innerHTML = days;
        hoursEle.innerHTML = hours;
        minutesEle.innerHTML = minutes;
        secondsEle.innerHTML = seconds;
      }, 1000);
    </script>
  </body>
</html>
