<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="rockPapperScissor.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="heading">
      <h2>ROCK PAPPER SCISSOR</h2>
    </div>
    <div>
      <div class="img-container">
        <div class="img fist" id="rock"><img src="fist.png" alt="" /></div>
        <div class="img hello" id="paper"><img src="hello.png" alt="" /></div>
        <div class="img hand" id="scissor"><img src="hand.png" alt="" /></div>
      </div>
      <div class="score-container">
        <div class="score-board">
          <div><p class="uScore">0</p></div>
          <div><p>YOU</p></div>
        </div>
        <div class="score-board">
          <div><p class="cScore">0</p></div>
          <div><p>COMPUTER</p></div>
        </div>
      </div>
      <div class="msg-container">
        <div class="msg"><p class="p">Play Your Move</p></div>
      </div>
    </div>

    <script src="rockPapperScissor.js"></script>
  </body>
</html>
